# How the visitor originally connected. When something in front of nginx
# has already decrypted HTTPS (a hosting platform's load balancer), nginx
# itself only sees plain HTTP, so $scheme says "http". That front proxy
# says "https" in X-Forwarded-Proto; pass that on, so the API still marks
# the login cookie Secure. Faking the header gains nothing: it can only
# make a client's own cookie stricter.
map $http_x_forwarded_proto $original_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # The API, on the "api" service in docker-compose.yml.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    # Tell the API who the real client is and how they connected. The API
    # runs with TRUST_PROXY=true and uses the LAST X-Forwarded-For address,
    # so we replace the header instead of appending to it: a client can't
    # smuggle in a fake address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $original_scheme;
  }

  # The app itself. Built files have content hashes in their names, so they
  # can be cached for good; index.html must always be fetched fresh.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
